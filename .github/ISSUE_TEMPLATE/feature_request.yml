name: Feature request
description: An idea for Lucid
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation first, then the idea. A note format or block type you miss is a good request.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Lucid to do?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
