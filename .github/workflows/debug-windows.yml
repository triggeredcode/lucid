name: Debug Windows PDF

# Temporary: builds the unpacked Windows app and runs only the PDF test of the packaged-app tests, with the app's logs.
on:
  push:
    branches: [packaging]
    paths: [".github/workflows/debug-windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lucid/desktop dist:dir
      - name: The PDF test, with the app's logs
        run: pnpm --filter @lucid/desktop exec playwright test -c playwright.packaged.config.ts -g "PDF with a diagram"
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        with:
          name: debug-windows
          if-no-files-found: ignore
          path: apps/desktop/test-results
